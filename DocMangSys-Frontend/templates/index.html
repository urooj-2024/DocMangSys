<!-- templates/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Document Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>All Documents</h1>
    <a href="{{ url_for('upload') }}">Upload New Document</a>
    <table border="1">
        <tr>
            <th>ID</th><th>Title</th><th>Content</th><th>Actions</th>
        </tr>
        {% for doc in documents %}
        <tr>
            <td>{{ doc.id }}</td>
            <td>{{ doc.title }}</td>
            <td>{{ doc.content }}</td>
            <td>
                <a href="{{ url_for('view', doc_id=doc.id) }}">View</a> |
                <a href="{{ url_for('update', doc_id=doc.id) }}">Update</a> |
                <a href="{{ url_for('download', doc_id=doc.id) }}">Download</a> |
                <a href="{{ url_for('delete', doc_id=doc.id) }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
